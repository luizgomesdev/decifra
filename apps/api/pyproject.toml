[project]
name = "decifra-api"
version = "0.1.0"
description = "Decifra API — ingestão e agente RAG sobre laudos genéticos"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
    "langchain-qdrant>=1.0",
    "qdrant-client>=1.12",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "docling>=2.121.0",
    # Declared explicitly so tool.uv.sources can pin the CPU-only build.
    # This machine has no NVIDIA GPU: the CUDA wheels are 3.4 GB of dead weight.
    "torch",
    "torchvision",
    "langgraph-checkpoint-postgres>=3.1.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decifra"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
