name: decifra

# Deployed stack: same pieces as compose.yml plus the API and the built front.
# Every secret comes from the .env file that lives only on the server.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    logging: *logging
    image: qdrant/qdrant:v1.16.1
    restart: unless-stopped
    # Loopback only: the ingestion runs from a laptop through an SSH tunnel.
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: decifra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: decifra
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decifra"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    logging: *logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://decifra:${POSTGRES_PASSWORD}@postgres:5432/decifra
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      REPORTS_DIR: /data/reports
    volumes:
      - ./data/reports:/data/reports
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    logging: *logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
